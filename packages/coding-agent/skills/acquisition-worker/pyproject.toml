[project]
name = "prime-agent-skill-acquisition-worker"
version = "0.1.0"
description = "Acquisition worker skill for Prime Agent (execute one coverage cell via web search)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
acquisition_worker = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_worker"]
