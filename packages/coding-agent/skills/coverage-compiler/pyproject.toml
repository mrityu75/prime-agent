[project]
name = "prime-agent-skill-coverage-compiler"
version = "0.1.0"
description = "Coverage compiler skill for Prime Agent (compile a Query Contract into mandatory coverage cells)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coverage_compiler = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_compiler"]
