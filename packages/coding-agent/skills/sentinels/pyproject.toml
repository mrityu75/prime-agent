[project]
name = "prime-agent-skill-sentinels"
version = "0.1.0"
description = "Sentinels skill for Prime Agent (independent omission search beyond the mandatory coverage cells)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sentinels = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinels"]
