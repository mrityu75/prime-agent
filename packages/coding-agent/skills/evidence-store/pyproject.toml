[project]
name = "prime-agent-skill-evidence-store"
version = "0.1.0"
description = "Evidence store skill for Prime Agent (persist pipeline output to Supabase)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "prime-agent-runtime"]

[project.scripts]
evidence_store = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_store"]
