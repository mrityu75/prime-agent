[project]
name = "prime-agent-skill-lawful-fetch"
version = "0.1.0"
description = "Lawful-fetch skill for Prime Agent (evidence documents via public APIs)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4", "lxml", "prime-agent-runtime"]

[project.scripts]
lawful_fetch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawful_fetch"]
