[project]
name = "prime-agent-skill-verdict-queue"
version = "0.1.0"
description = "Verdict queue skill for Prime Agent (resumable per-candidate admission verdicts)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "prime-agent-runtime"]

[project.scripts]
verdict_queue = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_queue"]
