[project]
name = "prime-agent-skill-admission-gate"
version = "0.1.0"
description = "Admission gate skill for Prime Agent (deterministic admission from supported claims)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "prime-agent-runtime"]

[project.scripts]
admission_gate = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admission_gate"]
